<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="greenPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/>

  <!-- Grid Lines Pattern (High Tech Feeling) -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    
    <line x1="150" y1="0" x2="150" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
    <line x1="450" y1="0" x2="450" y2="350"/>
    <line x1="600" y1="0" x2="600" y2="350"/>
    <line x1="750" y1="0" x2="750" y2="350"/>
    <line x1="900" y1="0" x2="900" y2="350"/>
    <line x1="1050" y1="0" x2="1050" y2="350"/>
  </g>

  <!-- Animated Dynamic Failover Circuit / Flow Lines (Background Layer) -->
  <g opacity="0.6">
    <!-- Active Node Ring Animation -->
    <circle cx="150" cy="175" r="45" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="35;55;35" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="1050" cy="175" r="45" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="55;35;55" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Failover Connection Path (Top Wave) -->
    <path d="M 150 175 Q 350 70 600 70 T 1050 175" fill="none" stroke="url(#primaryGlow)" stroke-width="3" stroke-dasharray="8 6" filter="url(#subtleGlow)">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="5s" repeatCount="indefinite"/>
    </path>

    <!-- Failover Backup Path (Bottom Wave) -->
    <path d="M 150 175 Q 350 280 600 280 T 1050 175" fill="none" stroke="url(#greenPulse)" stroke-width="3" stroke-dasharray="10 8" filter="url(#subtleGlow)">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- Active Pulsing Data Packets -->
    <circle cx="150" cy="175" r="6" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="1050" cy="175" r="6" fill="#34d399" filter="url(#glow)"/>
  </g>

  <!-- Central Foreground Content Card (Ensures text stays clear & unblocked) -->
  <rect x="220" y="55" width="760" height="240" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>

  <!-- High Availability Shield Icon -->
  <g transform="translate(600, 95) scale(0.9)">
    <path d="M 0 -22 L 18 -12 V 6 C 18 17 9 25 0 29 C -9 25 -18 17 -18 6 V -12 Z" fill="none" stroke="url(#primaryGlow)" stroke-width="3.5" filter="url(#subtleGlow)"/>
    <path d="M -5 0 L -1 4 L 6 -4" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- FOREGROUND TEXT (Prominent, High Contrast & Legible) -->
  <!-- Title -->
  <text x="600" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="0.5">
    HIGH AVAILABILITY &amp; FAILOVER
  </text>
  
  <text x="600" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="url(#primaryGlow)" letter-spacing="1">
    APPLICATION RECOVERY ECOSYSTEM
  </text>

  <!-- Subtitle -->
  <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#94a3b8" letter-spacing="0.2">
    GSLB • DNS Failover • Multi-Region Recovery • Anycast • Health Checks
  </text>

  <!-- Active Status Pills inside Card -->
  <g transform="translate(420, 262)">
    <rect x="0" y="0" width="170" height="22" rx="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <circle cx="14" cy="11" r="4" fill="#10b981"/>
    <text x="26" y="15" font-family="sans-serif" font-size="11" font-weight="600" fill="#c7d2fe">99.999% UPTIME</text>

    <rect x="190" y="0" width="170" height="22" rx="11" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <circle cx="204" cy="11" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="216" y="15" font-family="sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">AUTO-FAILOVER</text>
  </g>
</svg>
